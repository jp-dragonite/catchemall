# AWS Amplify Hosting build spec for a static Next.js export.
# In the Amplify console, choose "Deploy without Git" or connect this repo;
# Amplify auto-detects this file. Output is the static `out/` directory.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
